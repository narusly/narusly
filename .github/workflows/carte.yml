name: carte

# Recalcule les statistiques (dépôts, tests, état de la CI) et régénère les cartes SVG.
on:
  schedule:
    - cron: "17 5 * * 1"   # chaque lundi, 05:17 UTC
  workflow_dispatch:
  push:
    paths: ["profil.toml", "build.py", "ascii/**"]

permissions:
  contents: write

jobs:
  carte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enregistre les cartes si elles ont changé
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets stats.json
            git commit -m "Mise à jour automatique de la carte"
            git push
          fi
